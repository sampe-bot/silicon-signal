name: Publish SILICON SIGNAL Weekly

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/weekly.yml'
      - 'scripts/**'
      - 'config/**'
  workflow_dispatch:
    inputs:
      week:
        description: 'previous / current / YYYY-Www'
        required: false
        default: 'previous'
  schedule:
    # Every Monday 07:17 JST (Sunday 22:17 UTC), outside the top-of-hour congestion.
    - cron: '12 22 * * 0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect weekly news
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: 'nvidia/nemotron-3.5-super-vl:free'
          TARGET_WEEK: ${{ github.event.inputs.week || 'previous' }}
        run: python scripts/collect.py --week "$TARGET_WEEK"
      - name: Commit new edition to history
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish weekly industry digest'
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
